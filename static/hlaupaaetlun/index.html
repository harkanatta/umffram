<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 KM Running Plan — July 18</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #FF5C00;
    color: #000;
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Header ── */
  .header {
    background: #000;
    padding: 32px 24px 28px;
    text-align: center;
  }
  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    color: #FF5C00;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: -2px;
    color: #fff;
    line-height: 1;
    margin-bottom: 10px;
  }
  .header-sub {
    font-size: 13px;
    letter-spacing: 3px;
    color: #FF5C00;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* ── Layout ── */
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 16px 48px;
  }

  /* ── Section label ── */
  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #000;
    text-transform: uppercase;
    font-weight: 800;
    margin-bottom: 10px;
    opacity: 0.6;
  }

  /* ── Tier buttons ── */
  .tier-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .tier-btn {
    flex: 1;
    min-width: 110px;
    padding: 16px 14px;
    border-radius: 20px;
    border: 3px solid #000;
    background: #fff;
    color: #000;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all 0.12s;
  }
  .tier-btn:hover {
    background: #000;
    color: #fff;
  }
  .tier-btn .t-icon { font-size: 22px; margin-bottom: 6px; display: block; }
  .tier-btn .t-name { font-size: 15px; font-weight: 800; display: block; }
  .tier-btn .t-sub  { font-size: 11px; letter-spacing: 1px; opacity: 0.6; display: block; font-weight: 600; }

  .tier-btn.active {
    background: #000;
    color: #fff;
  }
  .tier-btn.active .t-sub { opacity: 0.7; }

  .tier-desc {
    padding: 14px 18px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 20px;
    font-size: 14px;
    color: #000;
    margin-bottom: 24px;
    line-height: 1.6;
    font-weight: 500;
  }

  /* ── Week selector ── */
  .week-grid {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .week-btn {
    padding: 8px 12px;
    border-radius: 50px;
    border: 3px solid #000;
    background: #fff;
    color: #000;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    transition: all 0.12s;
    min-width: 40px;
    text-align: center;
  }
  .week-btn:hover { background: #000; color: #fff; }
  .week-btn.active { background: #000; color: #fff; }

  .week-date-label {
    font-size: 12px;
    color: #000;
    margin-bottom: 20px;
    margin-top: 8px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* ── Sessions ── */
  .sessions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .session-card {
    padding: 16px 18px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 20px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .session-card.race-day {
    background: #000;
    border-color: #000;
  }
  .session-num {
    min-width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #FF5C00;
    flex-shrink: 0;
  }
  .session-card.race-day .session-num {
    background: #FF5C00;
    color: #000;
  }
  .session-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #000;
    margin-bottom: 4px;
    font-weight: 800;
    opacity: 0.5;
  }
  .session-card.race-day .session-label { color: #FF5C00; opacity: 0.8; }
  .session-text {
    font-size: 15px;
    color: #000;
    line-height: 1.5;
    font-weight: 500;
  }
  .session-card.race-day .session-text { color: #fff; }

  .coach-note {
    padding: 14px 18px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 20px;
    font-size: 13px;
    color: #000;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 20px;
    font-weight: 500;
  }
  .coach-note strong { font-weight: 800; }

  /* ── Progress bar ── */
  .progress-wrap { margin-bottom: 24px; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #000;
    margin-bottom: 8px;
    font-weight: 800;
    letter-spacing: 2px;
    opacity: 0.7;
  }
  .progress-track {
    height: 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 50px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 50px;
    background: #000;
    transition: width 0.3s ease;
  }

  /* ── Tips accordion ── */
  .tips-toggle {
    width: 100%;
    padding: 16px 20px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 20px;
    color: #000;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    text-align: left;
    transition: all 0.12s;
  }
  .tips-toggle:hover { background: #000; color: #fff; }
  .tips-toggle .chevron {
    font-size: 22px;
    font-weight: 900;
    transition: transform 0.2s;
  }
  .tips-panel { display: none; flex-direction: column; gap: 8px; margin-top: 8px; }
  .tips-panel.open { display: flex; }
  .tip-card {
    padding: 14px 16px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 20px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .tip-icon { font-size: 20px; flex-shrink: 0; }
  .tip-title { font-weight: 800; color: #000; font-size: 14px; margin-bottom: 4px; }
  .tip-body { font-size: 13px; color: #000; line-height: 1.6; opacity: 0.7; }

  /* ── Footer ── */
  .footer {
    margin-top: 32px;
    padding: 16px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: #000;
    opacity: 0.5;
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">10-Week Training Programme</div>
  <h1>5 KM RUN</h1>
  <div class="header-sub">Race Day: July 18 &nbsp;·&nbsp; Start: May 10</div>
</div>

<div class="container">

  <div class="section-label">Select your level</div>
  <div class="tier-grid" id="tierGrid"></div>
  <div class="tier-desc" id="tierDesc"></div>

  <div class="section-label">Week</div>
  <div class="week-grid" id="weekGrid"></div>
  <div class="week-date-label" id="weekDateLabel"></div>

  <div class="sessions" id="sessions"></div>

  <div class="coach-note" id="coachNote">
    <span style="flex-shrink:0">📋</span>
    <span id="coachNoteText"></span>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span>Progress</span>
      <span id="progressPct"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <button class="tips-toggle" id="tipsToggle" onclick="toggleTips()">
    <span>🩺 &nbsp;Body care: joints, weight &amp; recovery</span>
    <span class="chevron" id="tipsChevron">+</span>
  </button>
  <div class="tips-panel" id="tipsPanel"></div>

  <div class="footer">May 10 — July 18 &nbsp;·&nbsp; 10 Weeks &nbsp;·&nbsp; 5 km &nbsp;·&nbsp; 3 Sessions / Week</div>
</div>

<script>
const tiers = [
  {
    id: "beginner",
    label: "Beginner",
    subtitle: "Walk / Run",
    icon: "🚶",
    description: "Little or no recent running. Possibly carrying extra weight or managing joint discomfort. Goal: finish the 5k — walk/run is completely fine.",
    weeks: [
      { sessions: ["Walk 5 min warm-up → Run 1 min / Walk 2 min × 6 → Walk 5 min cool-down", "Same as Session 1", "Walk 5 min → Run 1 min / Walk 2 min × 7 → Cool-down"], note: "Focus on breathing, not pace. If it feels hard, slow down more." },
      { sessions: ["Run 1 min / Walk 2 min × 8", "Run 1.5 min / Walk 2 min × 7", "Run 1 min / Walk 1.5 min × 8"], note: "Aim for 3 sessions but 2 is fine if your body is adapting." },
      { sessions: ["Run 2 min / Walk 2 min × 6", "Run 2 min / Walk 1.5 min × 7", "Run 2 min / Walk 2 min × 7"], note: "Calf and hip flexor stretches after every session." },
      { sessions: ["Run 3 min / Walk 2 min × 5", "Run 2 min / Walk 1 min × 8", "Run 3 min / Walk 2 min × 5"], note: "You should be able to hold a short conversation while running." },
      { sessions: ["Run 4 min / Walk 2 min × 4", "Run 3 min / Walk 1 min × 6", "Run 4 min / Walk 2 min × 4"], note: "Total movement time ~30 min. Hydrate well the day before." },
      { sessions: ["Run 5 min / Walk 2 min × 4", "Run 4 min / Walk 1 min × 5", "Run 5 min / Walk 1.5 min × 4"], note: "Halfway point — great progress. Easy week if any pain persists." },
      { sessions: ["Run 6 min / Walk 1.5 min × 4", "Run 5 min / Walk 1 min × 5", "Run 6 min / Walk 1 min × 4"], note: "Aim to cover ~2.5–3 km in the longer session." },
      { sessions: ["Run 8 min / Walk 2 min × 3", "Run 6 min / Walk 1 min × 4", "Run 10 min / Walk 2 min / Run 5 min"], note: "First 'long' run. No pressure on pace — just cover the time." },
      { sessions: ["Run 12 min / Walk 2 min / Run 8 min", "Easy 20 min walk/run — relaxed", "Run 8 min / Walk 1 min × 2 / Run 5 min"], note: "Taper week. Reduce effort. Eat and sleep well." },
      { sessions: ["20 min easy jog/walk — keep loose", "Complete rest or gentle 15 min walk", "🏁 RACE DAY — Run/walk your way to the finish!"], note: "Race day: Start slow. Walk when needed. Finish strong. You've earned it." },
    ]
  },
  {
    id: "intermediate",
    label: "Intermediate",
    subtitle: "Build to Continuous",
    icon: "🏃",
    description: "Can jog lightly or walk briskly. May have run before but lost fitness. Goal: run most or all of the 5k without stopping.",
    weeks: [
      { sessions: ["20 min easy jog — no pressure on pace", "25 min run/walk: 5 min run / 2 min walk × 3", "20 min steady jog"], note: "Keep heart rate conversational. Establish baseline fitness." },
      { sessions: ["25 min continuous easy jog", "30 min run: 10 min run / 2 min walk × 2 + 6 min run", "25 min easy jog"], note: "If you can't hold a sentence, slow down." },
      { sessions: ["3 km easy run", "30 min: 12 min run / 2 min walk × 2", "3 km easy + 4 × 30 sec stride-outs at end"], note: "Stride-outs = short relaxed accelerations, not sprints." },
      { sessions: ["3.5 km steady", "35 min continuous jog", "3 km easy"], note: "One day of cross-training (swim, cycle, yoga) recommended." },
      { sessions: ["4 km easy", "3 km at slightly faster effort (tempo feel)", "35 min easy jog"], note: "Tempo feel = comfortably hard. You can talk in short phrases." },
      { sessions: ["4 km steady + strides", "5 km easy — your first full 5k distance!", "3 km recovery jog"], note: "The 5k run is a confidence builder, not a race. Celebrate it." },
      { sessions: ["4.5 km steady", "3 × 1 km at target 5k pace with 90 sec walk between", "4 km easy"], note: "Interval session builds race-specific fitness. Walk recovery fully." },
      { sessions: ["5 km steady effort", "2 × 1.5 km at target pace + 2 min walk + 1 km easy", "3.5 km easy"], note: "Peak training week. Stay fuelled, sleep 7–8 hours." },
      { sessions: ["4 km easy", "2 × 1 km relaxed race pace + 2 min walk", "3 km easy jog"], note: "Taper. Less volume, maintain some quality. Rest days are part of training." },
      { sessions: ["20 min easy shakeout jog", "Rest — walk only if needed", "🏁 RACE DAY — Pace the first 2 km conservatively, then build!"], note: "Race plan: first km easy, km 2–4 steady, last km give it what's left." },
    ]
  },
  {
    id: "advanced",
    label: "Advanced",
    subtitle: "Time & Performance",
    icon: "⚡",
    description: "Running regularly, good base fitness. Goal: run a strong 5k — targeting sub-30, sub-25, or a personal best.",
    weeks: [
      { sessions: ["5 km easy (zone 2)", "30 min easy + 4 × 30 sec strides", "5 km easy"], note: "Assess current fitness. No heroics in week 1." },
      { sessions: ["6 km easy", "5 × 400m at 5k pace + 90 sec jog recovery", "5 km easy"], note: "Track or measured path for intervals. Full warm-up first." },
      { sessions: ["7 km easy long run", "3 × 1 km at 5k pace + 2 min walk recovery", "5 km steady"], note: "Long run should feel effortless. If not, slow down." },
      { sessions: ["6 km easy", "6 × 400m at slightly faster than 5k pace + 90 sec recovery", "5 km at marathon effort (very easy)"], note: "Cross-training day recommended — swim, bike, or strength." },
      { sessions: ["8 km easy long run", "Tempo: 2 km warm-up + 3 km at comfortably hard pace + 2 km cool-down", "5 km easy"], note: "Tempo run is the key session. Aim for 20–30 sec/km faster than goal pace." },
      { sessions: ["6 km steady", "5 × 800m at 5k pace + 2 min jog recovery", "5 km easy"], note: "Halfway milestone. Check in — are you pacing correctly? Feeling strong?" },
      { sessions: ["8–9 km easy long run", "Fartlek: 20 min easy + 5 × 1 min fast / 1 min easy + 10 min easy", "5 km easy"], note: "Fartlek = speed play. Run by feel, not exact pace." },
      { sessions: ["9 km easy long run (peak week)", "4 × 1 km at goal 5k pace + 90 sec jog", "5 km steady"], note: "Peak volume. Prioritize sleep and nutrition." },
      { sessions: ["6 km easy", "2 × 1.5 km at race pace + 2 min walk", "4 km easy + strides"], note: "Taper begins. Keep some sharpness, reduce total load." },
      { sessions: ["20–25 min easy shakeout + 4 × 20 sec strides", "Rest — light walk only", "🏁 RACE DAY — Negative split strategy: run km 1 slightly slower than goal, build to finish!"], note: "Race day: warm up 10 min before start. Start controlled. Km 4 is where you race." },
    ]
  }
];

const weekDates = [
  "May 10–16","May 17–23","May 24–30",
  "May 31–Jun 6","Jun 7–13","Jun 14–20",
  "Jun 21–27","Jun 28–Jul 4","Jul 5–11","Jul 12–18"
];

const tips = [
  { icon:"🦵", title:"Knee pain", body:"Run on softer surfaces (grass, trail, track). Shorten stride. Strengthen quads — wall sits, step-downs." },
  { icon:"🦴", title:"Hip pain", body:"Warm up glutes before every run: clamshells, bridges, hip circles. Avoid sudden pace increases." },
  { icon:"🦶", title:"Achilles pain", body:"Never skip calf raises (eccentric, off a step). Avoid running on hard cambered roads. No barefoot sprinting." },
  { icon:"⚖️", title:"Heavier runners (100+ kg)", body:"Allow 48h recovery between runs. Water running or cycling can substitute one session per week. Shoes with extra cushioning — replace every 600–700 km." },
  { icon:"🌡️", title:"Iceland summer heat", body:"If temperature rises above 15°C, slow your pace by 10–15 sec/km and hydrate extra." },
  { icon:"🧘", title:"Warm-up (every session)", body:"5 min brisk walk → leg swings ×10 each → hip circles ×10 → ankle rolls ×10 → 2 min easy jog. Cool-down: 5 min slow walk + quad, calf, hamstring, hip flexor stretches (30–40 sec each)." },
];

let activeTier = "intermediate";
let activeWeek = 0;

function getTier() { return tiers.find(t => t.id === activeTier); }

function renderTiers() {
  const grid = document.getElementById("tierGrid");
  grid.innerHTML = "";
  tiers.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "tier-btn" + (t.id === activeTier ? " active" : "");
    btn.innerHTML = `<span class="t-icon">${t.icon}</span><span class="t-name">${t.label}</span><span class="t-sub">${t.subtitle}</span>`;
    btn.onclick = () => { activeTier = t.id; render(); };
    grid.appendChild(btn);
  });
}

function renderWeeks() {
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    const btn = document.createElement("button");
    btn.className = "week-btn" + (i === activeWeek ? " active" : "");
    btn.textContent = i === 9 ? "🏁" : `W${i+1}`;
    btn.onclick = () => { activeWeek = i; render(); };
    grid.appendChild(btn);
  }
  document.getElementById("weekDateLabel").textContent =
    weekDates[activeWeek] + (activeWeek === 9 ? " — RACE WEEK" : "");
}

function renderSessions() {
  const tier = getTier();
  const week = tier.weeks[activeWeek];
  const container = document.getElementById("sessions");
  container.innerHTML = "";

  week.sessions.forEach((s, i) => {
    const isRace = i === 2 && activeWeek === 9;
    const card = document.createElement("div");
    card.className = "session-card" + (isRace ? " race-day" : "");

    const num = document.createElement("div");
    num.className = "session-num";
    num.textContent = isRace ? "🏁" : `S${i+1}`;

    const body = document.createElement("div");
    body.style.flex = "1";

    const label = document.createElement("div");
    label.className = "session-label";
    label.textContent = isRace ? "RACE DAY" : `SESSION ${i+1}`;

    const text = document.createElement("div");
    text.className = "session-text";
    text.textContent = s;

    body.appendChild(label);
    body.appendChild(text);
    card.appendChild(num);
    card.appendChild(body);
    container.appendChild(card);
  });

  document.getElementById("coachNoteText").innerHTML =
    `<strong>Coach note:</strong> ${week.note}`;
}

function renderProgress() {
  const pct = Math.round(((activeWeek + 1) / 10) * 100);
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
}

function renderTierDesc() {
  document.getElementById("tierDesc").textContent = getTier().description;
}

function renderTips() {
  const panel = document.getElementById("tipsPanel");
  panel.innerHTML = "";
  tips.forEach(t => {
    const card = document.createElement("div");
    card.className = "tip-card";
    card.innerHTML = `<div class="tip-icon">${t.icon}</div>
      <div><div class="tip-title">${t.title}</div><div class="tip-body">${t.body}</div></div>`;
    panel.appendChild(card);
  });
}

function toggleTips() {
  const open = document.getElementById("tipsPanel").classList.toggle("open");
  document.getElementById("tipsChevron").textContent = open ? "−" : "+";
}

function render() {
  renderTiers();
  renderTierDesc();
  renderWeeks();
  renderSessions();
  renderProgress();
}

renderTips();
render();
</script>
</body>
</html>
