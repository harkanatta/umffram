<style>
#skali-cal { margin: 1.5rem 0 2rem; }
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-nav button { background:#002c98; color:#fff; border:none; border-radius:8px; padding:6px 14px; font-size:18px; cursor:pointer; font-family:inherit; }
.cal-nav button:hover { background:#001a6e; }
#cal-month-label { font-size:17px; font-weight:800; letter-spacing:1px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-day-header { text-align:center; font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; opacity:0.5; padding:4px 0; }
.cal-day { border-radius:8px; padding:8px 4px; text-align:center; font-size:14px; font-weight:700; min-height:36px; display:flex; align-items:center; justify-content:center; }
.cal-day.empty { background:transparent; }
.cal-day.free { background:#e8f5e9; color:#1b5e20; }
.cal-day.booked { background:#002c98; color:#fff; }
.cal-day.uncertain { background:repeating-linear-gradient(45deg,#f5f5f5,#f5f5f5 4px,#e0e0e0 4px,#e0e0e0 8px); color:#666; }
.cal-day.today { outline:2px solid #f5e400; outline-offset:-2px; }
.cal-legend { display:flex; gap:16px; margin-top:10px; font-size:13px; font-weight:700; flex-wrap:wrap; }
.cal-legend span { display:flex; align-items:center; gap:6px; }
.cal-legend span::before { content:''; display:inline-block; width:14px; height:14px; border-radius:4px; }
.cal-legend .leg-free::before { background:#e8f5e9; border:2px solid #1b5e20; }
.cal-legend .leg-booked::before { background:#002c98; }
.cal-legend .leg-uncertain::before { background:repeating-linear-gradient(45deg,#f5f5f5,#f5f5f5 4px,#e0e0e0 4px,#e0e0e0 8px); border:1px solid #ccc; }
</style>

<div id="skali-cal">
  <div class="cal-nav">
    <button onclick="calPrev()">&#8249;</button>
    <span id="cal-month-label"></span>
    <button onclick="calNext()">&#8250;</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-legend">
    <span class="leg-free">Laust</span>
    <span class="leg-booked">Bókað</span>
    <span class="leg-uncertain">Óvíst (veður)</span>
  </div>
</div>

<script>
(function(){
  var IS_MONTHS = ['Janúar','Febrúar','Mars','Apríl','Maí','Júní','Júlí','Ágúst','September','Október','Nóvember','Desember'];
  var IS_DAYS   = ['Mán','Þri','Mið','Fim','Fös','Lau','Sun'];

  var BOOKINGS = JSON.parse({{ .Site.Data.skidaskalinn_bookings | jsonify }});

  var bookedDates    = new Set();
  var uncertainDates = new Set();

  BOOKINGS.forEach(function(b) {
    var s = new Date(b.start), e = new Date(b.end);
    var map = b.type === 'uncertain' ? uncertainDates : bookedDates;
    for (var d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
      map.add(d.toISOString().slice(0,10));
    }
  });

  var now = new Date();
  var currentYear  = now.getFullYear();
  var currentMonth = now.getMonth();

  function toKey(d) { return d.toISOString().slice(0,10); }

  function renderCal() {
    var grid = document.getElementById('cal-grid');
    document.getElementById('cal-month-label').textContent = IS_MONTHS[currentMonth] + ' ' + currentYear;
    var today = toKey(new Date());
    var firstDay    = new Date(currentYear, currentMonth, 1);
    var daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
    var startDow = firstDay.getDay();
    startDow = startDow === 0 ? 6 : startDow - 1;

    var html = IS_DAYS.map(function(d){ return '<div class="cal-day-header">'+d+'</div>'; }).join('');
    for (var i = 0; i < startDow; i++) html += '<div class="cal-day empty"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var key = currentYear + '-' + String(currentMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var cls = bookedDates.has(key) ? 'booked' : uncertainDates.has(key) ? 'uncertain' : 'free';
      var todayCls = key === today ? ' today' : '';
      html += '<div class="cal-day ' + cls + todayCls + '">' + day + '</div>';
    }
    grid.innerHTML = html;
  }

  window.calPrev = function() { currentMonth--; if (currentMonth < 0) { currentMonth=11; currentYear--; } renderCal(); };
  window.calNext = function() {
    if (currentYear >= 2027 && currentMonth >= 11) return;
    currentMonth++; if (currentMonth > 11) { currentMonth=0; currentYear++; }
    renderCal();
  };

  renderCal();
})();
</script>
